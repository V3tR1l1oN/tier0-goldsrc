name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: x86 MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build tier0.dll
        shell: cmd
        run: build.bat

      - name: Verify export count (dumpbin /EXPORTS)
        shell: cmd
        run: |
          dumpbin /EXPORTS build\tier0.dll > build\exports.txt
          powershell -NoProfile -Command "if (-not (Select-String -Path build\exports.txt -Pattern '^\s*316 number of functions\s*$')) { Get-Content build\exports.txt | Select-Object -Last 5; Write-Error 'export count != 316'; exit 1 }"

      - name: Build test harnesses
        shell: cmd
        run: tests\build_tests.bat

      - name: Run test suite
        shell: pwsh
        run: |
          Copy-Item build\tier0.dll tests\tier0.dll -Force
          $procs = @(
            @{ n = 'test_exports';   e = 0 },
            @{ n = 'test_mem';       e = 0 },
            @{ n = 'test_vprof';     e = 0 },
            @{ n = 'test_getsize2048'; e = 0 },
            @{ n = 'test_sba_stress'; e = 0 },
            @{ n = 'test_sba_mt';    e = 0 },
            @{ n = 'sba_diag';       e = 0 },
            @{ n = 'test_regress';   e = 0 },
            @{ n = 'test_threadtools'; e = 0 },
            @{ n = 'test_sba_shutdown'; e = 0 }
          )
          # test_crash intentionally crashes (heap corruption assert) -- not run.
          foreach ($t in $procs) {
            & "tests\$($t.n).exe" *> $null
            if ($LASTEXITCODE -ne $t.e) {
              Write-Error "$($t.n) failed: exit=$LASTEXITCODE expected=$($t.e)"
            } else {
              Write-Host "$($t.n): OK"
            }
          }

      - name: Run MT stress (long)
        shell: pwsh
        run: |
          & tests\test_sba_mt.exe 6000000 *> $null
          if ($LASTEXITCODE -ne 0) { Write-Error "test_sba_mt 6M failed: $LASTEXITCODE" }
          Write-Host "test_sba_mt 6M: OK"

      - name: CPU report contract (incl. pinned affinity)
        shell: pwsh
        run: |
          & tests\test_cpu.exe *> $null
          if ($LASTEXITCODE -ne 0) { Write-Error "test_cpu failed: $LASTEXITCODE" }
          & tests\test_cpu.exe 4 *> $null
          if ($LASTEXITCODE -ne 0) { Write-Error "test_cpu 4 (pinned) failed: $LASTEXITCODE" }
          Write-Host "test_cpu: OK (default + pinned 4)"

      - name: Run fallback mode suite (SBA_ARENA=0)
        shell: pwsh
        run: |
          # With the arena disabled, slab backing comes from malloc() instead of
          # the virtual reservation, so live pool blocks sit on the CRT heap and
          # OUTSIDE the arena address range. Every allocator test must pass in
          # that mode: a classify routine that pre-filters on the arena range
          # looks correct in the default configuration and corrupts the heap the
          # moment the arena is unavailable (SBA_ARENA=0 or a failed reservation).
          $env:SBA_ARENA = '0'
          $fails = @()
          foreach ($t in @('test_mem','test_sba_stress','test_getsize2048','test_regress','test_sba_shutdown')) {
            & "tests\$t.exe" *> $null
            if ($LASTEXITCODE -ne 0) { $fails += "$t exit=$LASTEXITCODE" }
          }
          & tests\test_sba_mt.exe 2000000 *> $null
          if ($LASTEXITCODE -ne 0) { $fails += "test_sba_mt exit=$LASTEXITCODE" }
          Remove-Item Env:SBA_ARENA
          if ($fails.Count) { Write-Error "fallback (SBA_ARENA=0) failures: $($fails -join ', ')" }
          Write-Host "fallback (SBA_ARENA=0): OK (6 tests)"

      - name: Crash-log smoke (test_crash crashes on purpose, TIER0_MD=1 writes .mdmp)
        shell: pwsh
        run: |
          # 'b' raises a BREAKPOINT (0x80000003) instead of the default heap
          # corruption (0xC0000374). Artificial 0xC0000374 can take the runtime's
          # fail-fast path and terminate without dispatching to tier0's vectored
          # handler on newer Windows; a BREAKPOINT reliably reaches it on all
          # versions, so the same crash.log + .mdmp write path is exercised.
          # Run inside tests/ so crash.log (module dir) and .mdmp (process CWD)
          # land together.
          Push-Location tests
          $env:TIER0_MD = '1'
          # The whole point of this step is that test_crash.exe dies on purpose, so
          # $LASTEXITCODE is nonzero (0x80000003). GitHub's pwsh runner decides the
          # step's result from $LASTEXITCODE, so clear it after capturing $code or the
          # step is marked failed even when every assertion below passes.
          & .\test_crash.exe b *> $null
          $code = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          Remove-Item Env:TIER0_MD
          if ($code -eq 0) { Write-Error "test_crash did not crash"; Pop-Location; exit 1 }
          $log = Get-Content .\crash.log -Raw -ErrorAction Stop
          if ($log -notmatch '=== CRASH ===') { Write-Error "crash.log has no crash record"; Pop-Location; exit 1 }
          $md = Get-ChildItem -Filter *.mdmp -ErrorAction SilentlyContinue | Where-Object { $_.Name -notlike '(failed)*' }
          if ($md.Count -eq 0) { Write-Error "TIER0_MD=1 produced no valid .mdmp"; Pop-Location; exit 1 }
          Write-Host "crash code=$code (0x$('{0:X8}' -f ($code -band 0xFFFFFFFF))), $(($log.Length))B crash.log, mdmp=$($md[0].Name)"
          Remove-Item .\crash.log, $md.FullName -ErrorAction SilentlyContinue
          Pop-Location
          exit 0

      - name: Benchmark smoke
        shell: pwsh
        run: |
          & tests\bench.exe | Out-File -FilePath bench.out -Encoding utf8
          if ($LASTEXITCODE -ne 0) { Write-Error "bench failed: $LASTEXITCODE" }
          Select-String -Path bench.out -Pattern 'bench done' | ForEach-Object { $_.Line }

  linux:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps (g++ make binutils)
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make binutils

      - name: Build tier0.so (Makefile)
        run: make -f Makefile

      - name: Verify build/tier0.so exists
        run: |
          test -f build/tier0.so || { echo "build/tier0.so not found"; exit 1; }
          ls -lh build/tier0.so
          file build/tier0.so

      - name: Verify CreateInterface export (nm -D)
        run: |
          nm -D build/tier0.so | tee build/nm.txt
          grep -q "CreateInterface" build/nm.txt || { echo "CreateInterface not found in nm -D"; exit 1; }
          echo "CreateInterface: OK"

      - name: Alternative CMake build smoke (optional)
        run: |
          cmake -B build_cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build_cmake --config Release
          test -f build_cmake/tier0.so || test -f build_cmake/build/tier0.so || echo "cmake build produced tier0.so elsewhere (non-fatal)"

  asan:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: x86 MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build tier0.dll with ASan (MSVC /fsanitize=address)
        shell: cmd
        run: |
          set CL=/fsanitize=address
          set _CL_=/fsanitize=address
          call build.bat

      - name: Verify ASan DLL exports
        shell: cmd
        run: |
          dumpbin /EXPORTS build\tier0.dll > build\exports.txt
          powershell -NoProfile -Command "if (-not (Select-String -Path build\exports.txt -Pattern '^\s*316 number of functions\s*$')) { Write-Error 'export count != 316'; exit 1 }"

      - name: Build test harnesses
        shell: cmd
        run: tests\build_tests.bat

      - name: Run test suite under ASan
        shell: pwsh
        run: |
          Copy-Item build\tier0.dll tests\tier0.dll -Force
          $env:ASAN_OPTIONS = 'detect_leaks=0:halt_on_error=1'
          $procs = @(
            @{ n = 'test_mem';       e = 0 },
            @{ n = 'test_sba_stress'; e = 0 },
            @{ n = 'test_regress';   e = 0 },
            @{ n = 'test_threadtools'; e = 0 },
            @{ n = 'test_sba_shutdown'; e = 0 }
          )
          foreach ($t in $procs) {
            Write-Host "ASan: $($t.n)"
            & "tests\$($t.n).exe" *> $null
            if ($LASTEXITCODE -ne $t.e) {
              Write-Error "ASan $($t.n) failed: exit=$LASTEXITCODE"
            } else {
              Write-Host "ASan $($t.n): OK"
            }
          }

  linux-asan:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps (g++ make binutils)
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make binutils

      - name: Build tier0.so with ASan
        run: CXXFLAGS="-O1 -g -fsanitize=address -fno-omit-frame-pointer" LDFLAGS="-fsanitize=address -shared -fPIC" make -f Makefile

      - name: Verify build/tier0.so exists (ASan)
        run: |
          test -f build/tier0.so || { echo "build/tier0.so not found"; exit 1; }
          ls -lh build/tier0.so
          file build/tier0.so

      - name: Verify CreateInterface export (ASan, nm -D)
        run: |
          nm -D build/tier0.so | tee build/nm_asan.txt
          grep -q "CreateInterface" build/nm_asan.txt || { echo "CreateInterface not found"; exit 1; }
          echo "CreateInterface ASan: OK"