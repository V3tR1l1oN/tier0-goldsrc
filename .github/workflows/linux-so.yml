name: Linux SO

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to upload to (e.g. v1.8.2)'
        required: true
        default: 'v1.8.2'
  push:
    tags: ['v*']

jobs:
  build-so:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y g++ make binutils
      - name: Build tier0.so
        run: make -f Makefile && ls -lh build/tier0.so && file build/tier0.so && nm -D build/tier0.so | grep -q CreateInterface && echo "exports $(nm -D build/tier0.so | grep -c ' T ') -> 316 expected (nm count != dumpbin)" && ldd build/tier0.so
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          if [ -z "$TAG" ] || [ "$TAG" = "${{ github.ref }}" ]; then TAG="v1.8.2"; fi
          echo "Uploading build/tier0.so to $TAG"
          gh release upload "$TAG" build/tier0.so --clobber
